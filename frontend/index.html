<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0e1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Smart School EMS - Energy Management System">
    <title>Smart School EMS</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ============================================ -->
    <!-- APP SHELL                                    -->
    <!-- ============================================ -->
    <div id="app-shell">

        <!-- ======== TOP STATUS BAR ======== -->
        <header class="app-topbar" id="app-topbar">
            <div class="topbar-left">
                <i class="bi bi-lightning-charge-fill topbar-logo"></i>
                <div>
                    <span class="topbar-title">Smart School EMS</span>
                    <span class="topbar-subtitle" id="topbar-time">--:--:--</span>
                </div>
            </div>
            <div class="topbar-right">
                <span class="status-dot status-online" id="topbar-esp"></span>
                <span class="status-dot status-wifi" id="topbar-wifi"></span>
            </div>
        </header>

        <!-- ======== PAGE CONTAINER ======== -->
        <main class="app-pages" id="app-pages">

            <!-- ======================================== -->
            <!-- PAGE 1 : HOME                            -->
            <!-- ======================================== -->
            <div class="page active" id="page-home">
                <div class="page-inner">

                    <!-- SYSTEM STATUS CARD -->
                    <div class="card system-card">
                        <div class="card-body">
                            <div class="system-clock">
                                <div class="clock-time" id="home-clock">--:--:--</div>
                                <div class="clock-date" id="home-date">---, -- --- ----</div>
                            </div>
                            <div class="system-badges">
                                <span class="sys-badge" id="home-mode">
                                    <i class="bi bi-robot"></i>
                                    <span>AUTO</span>
                                </span>
                                <span class="sys-badge" id="home-esp">
                                    <i class="bi bi-cpu"></i>
                                    <span>Online</span>
                                </span>
                                <span class="sys-badge" id="home-wifi">
                                    <i class="bi bi-wifi"></i>
                                    <span>Connected</span>
                                </span>
                            </div>
                            <div class="electrical-row">
                                <div class="electrical-item">
                                    <span class="el-label">Voltage</span>
                                    <span class="el-value" id="home-voltage">220 <small>V</small></span>
                                </div>
                                <div class="electrical-divider"></div>
                                <div class="electrical-item">
                                    <span class="el-label">Current</span>
                                    <span class="el-value" id="home-current">4.25 <small>A</small></span>
                                </div>
                                <div class="electrical-divider"></div>
                                <div class="electrical-item">
                                    <span class="el-label">Power</span>
                                    <span class="el-value" id="home-power">935 <small>W</small></span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- DEVICE STATUS CARDS -->
                    <div class="section-label">Device Status</div>
                    <div class="device-grid" id="home-devices">
                        <!-- Generated by JS -->
                    </div>

                </div>
            </div>

            <!-- ======================================== -->
            <!-- PAGE 2 : CONTROL                         -->
            <!-- ======================================== -->
            <div class="page" id="page-control">
                <div class="page-inner">

                    <!-- SEGMENTED CONTROL -->
                    <div class="segmented-control" id="mode-selector">
                        <button class="seg-btn active" data-mode="auto">
                            <i class="bi bi-robot"></i> AUTO
                        </button>
                        <button class="seg-btn" data-mode="manual">
                            <i class="bi bi-hand-index-thumb"></i> MANUAL
                        </button>
                    </div>

                    <!-- AUTO MODE SECTION -->
                    <div class="mode-section active" id="section-auto">
                        <div class="section-label">
                            <i class="bi bi-calendar-clock"></i> Schedule Editor
                        </div>
                        <div class="schedule-list" id="schedule-list">
                            <!-- Generated by JS -->
                        </div>
                    </div>

                    <!-- MANUAL MODE SECTION -->
                    <div class="mode-section" id="section-manual">
                        <div class="section-label">
                            <i class="bi bi-toggles"></i> Relay Control
                        </div>
                        <div class="relay-list" id="relay-list">
                            <!-- Generated by JS -->
                        </div>
                    </div>

                </div>
            </div>

            <!-- ======================================== -->
            <!-- PAGE 3 : MONITORING                      -->
            <!-- ======================================== -->
            <div class="page" id="page-monitoring">
                <div class="page-inner">

                    <!-- SECTION 1: CURRENT MONITORING -->
                    <div class="section-label">
                        <i class="bi bi-graph-up-arrow"></i> Current Monitoring
                    </div>
                    <div class="card mb-3">
                        <div class="card-body p-3">
                            <div class="current-monitor" id="current-monitor">
                                <!-- Generated by JS -->
                            </div>
                            <div class="total-current-bar">
                                <div class="tcb-header">
                                    <span>Main Current Sensor</span>
                                    <span class="tcb-value" id="total-current-value">0.00 A</span>
                                </div>
                                <div class="progress total-progress">
                                    <div class="progress-bar total-bar" id="total-current-bar" style="width:0%"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- SECTION 2: SYSTEM STATISTICS -->
                    <div class="section-label">
                        <i class="bi bi-pie-chart"></i> System Statistics
                    </div>
                    <div class="card mb-3">
                        <div class="card-body p-3">
                            <div class="stat-grid" id="stat-grid">
                                <!-- Generated by JS -->
                            </div>
                        </div>
                    </div>

                    <!-- SECTION 3: ACTIVITY LOG -->
                    <div class="section-label">
                        <i class="bi bi-journal-text"></i> Activity Log
                    </div>
                    <div class="card mb-3">
                        <div class="card-body p-0">
                            <div class="activity-log" id="activity-log">
                                <!-- Generated by JS -->
                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </main>

        <!-- ======== BOTTOM NAVIGATION ======== -->
        <nav class="bottom-nav" id="bottom-nav">
            <button class="nav-item active" data-page="home">
                <i class="bi bi-house-fill nav-icon"></i>
                <span class="nav-label">Home</span>
            </button>
            <button class="nav-item" data-page="control">
                <i class="bi bi-sliders2 nav-icon"></i>
                <span class="nav-label">Control</span>
            </button>
            <button class="nav-item" data-page="monitoring">
                <i class="bi bi-bar-chart-fill nav-icon"></i>
                <span class="nav-label">Monitoring</span>
            </button>
        </nav>

    </div>

    <!-- ============================================ -->
    <!-- SCRIPTS                                     -->
    <!-- ============================================ -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    
    <!-- App Scripts -->
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/home.js"></script>
    <script src="js/jadwal.js"></script>
    <script src="js/status.js"></script>
</body>
</html>
